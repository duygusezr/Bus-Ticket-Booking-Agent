<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvatarAI Chatbot Arayüzü</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/",
            "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
        }
    }
    </script>
</head>

<body>
    <div id="app">
        <div class="main-layout">
            <!-- Sol Panel: Sohbet Arayüzü -->
            <div class="chat-panel">
                <div class="chat-header">
                    <div class="header-left">
                        <div id="fps-counter" style="display:none;"><i class="fa-solid fa-gauge"></i> FPS: 0</div>
                    </div>
                    <div class="header-right">
                        <div class="lang-switcher">
                            <button id="lang-tr" class="lang-btn active" title="Türkçe">TR</button>
                            <button id="lang-en" class="lang-btn" title="English">EN</button>
                        </div>
                    </div>
                </div>

                <div id="history-list" class="chat-history-area">
                    <div class="history-item ai">
                        <div class="bubble">
                            <img src="./ela_avatar.png" alt="bot" class="avatar-icon">
                            <div class="content" id="welcome-msg">Merhaba, ben Ela. Size en uygun otobüs biletini bulmam için nereden nereye ve hangi tarihte seyahat edeceğinizi söyler misiniz?</div>
                        </div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <div id="subtitle" style="font-size: 12px; color: #888; text-align: center; height: 16px; margin-bottom: 5px;"></div>
                    <div class="input-container">
                        <input type="text" id="chat-input" placeholder="Bir mesaj yazın..." />
                        <button id="mic-btn" class="mic-btn" title="Sesi etkinleştir"><i class="fa-solid fa-microphone"></i></button>
                        <button id="send-btn" class="send-btn" title="Gönder"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                    <div class="powered-by">Powered by <b>AvatarAI</b></div>
                </div>
            </div>

            <!-- Sağ Panel: Avatar -->
            <div class="avatar-panel">
                <div class="avatar-header-text">
                    <h3>Ela <b>AI</b></h3>
                    <p id="ai-subtitle">Otobüs bileti Randevu AI Asistanı</p>
                </div>
                <button class="menu-icon" title="Menu"><i class="fa-solid fa-bars"></i></button>
                <button class="avatar-settings-btn" id="avatar-settings-btn" title="Avatar Ayarları"><i class="fa-solid fa-sliders"></i></button>
                <div class="canvas-container" id="canvas-container">
                    <canvas id="canvas"></canvas>
                </div>
            </div>

            <!-- Gizli UI Elementleri -->
            <div style="display:none;">
                <button id="toggle-sidebar"></button>
                <button id="close-sidebar"></button>
                <div id="history-sidebar"></div>
                <button id="audio-btn"><i class="fa-solid fa-volume-high"></i></button>
            </div>
        </div>
    </div>

    <!-- Avatar Ayarları Modal -->
    <div id="avatar-modal" class="avatar-modal-overlay" hidden>
        <div class="avatar-modal-box">
            <div class="avatar-modal-header">
                <span><i class="fa-solid fa-user-astronaut"></i> Avatar Ayarları</span>
                <button id="avatar-modal-close" class="avatar-modal-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="avatar-modal-body">
                <div class="avatar-current-info">
                    <i class="fa-solid fa-circle-check"></i> <span id="avatar-current-name">Varsayılan avatar (character.vrm)</span>
                </div>
                <label class="avatar-upload-label" for="avatar-file-input">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>VRM dosyası seç veya sürükle bırak</span>
                    <small>.vrm formatı desteklenir</small>
                    <input type="file" id="avatar-file-input" accept=".vrm" hidden>
                </label>
                <div id="avatar-progress-wrap" class="avatar-progress-wrap" hidden>
                    <div class="avatar-progress-bar">
                        <div id="avatar-progress-fill" class="avatar-progress-fill"></div>
                    </div>
                    <span id="avatar-progress-text">Yükleniyor...</span>
                </div>
                <div id="avatar-status" class="avatar-status"></div>
                <div class="avatar-modal-actions">
                    <button id="avatar-reset-btn" class="avatar-reset-btn">
                        <i class="fa-solid fa-rotate-left"></i> Varsayılana Dön
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.__APP_CONFIG__ = {
            apiBase: "https://bus-ticket-booking-agent-production.up.railway.app",
            wsBase:  "wss://bus-ticket-booking-agent-production.up.railway.app"
        };
    </script>

    <script type="module" src="./main.js?v=6"></script>
</body>

</html>
